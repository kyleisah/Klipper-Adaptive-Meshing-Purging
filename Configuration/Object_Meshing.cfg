# # # KAMP Per-Object Meshing Klipper Extra # # #

# This config section loads Klipper_Extras/kamp_object_mesh.py after that file
# has been copied or symlinked into Klipper's klippy/extras directory.

[kamp_object_mesh]

# Minimum width/height, in millimeters, for an object mesh region. Very thin
# slicer polygons are expanded to this size so Klipper can safely probe at
# least a 3x3 grid.
min_region_size: 2.0

# KAMP's Adaptive_Meshing.cfg renames Klipper's original BED_MESH_CALIBRATE to
# _BED_MESH_CALIBRATE. The object helper calls this when it cannot safely use
# per-object meshing.
fallback_gcode: _BED_MESH_CALIBRATE
